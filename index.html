<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Pro Splitter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 15px; }
    .card { background: #1e293b; width: 100%; max-width: 450px; margin: auto; padding: 20px; border-radius: 16px; position: relative; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .menu-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
    .dropdown { display: none; position: absolute; right: 20px; top: 60px; background: #334155; border-radius: 8px; z-index: 10; width: 150px; }
    .dropdown button { display: block; width: 100%; padding: 10px; border: none; background: none; color: #fff; text-align: left; cursor: pointer; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    .btn-main { background: #2563eb; font-weight: bold; cursor: pointer; }
    .status { color: #38bdf8; font-size: 13px; text-align: center; margin: 10px 0; }
    .history-card { background: #0f172a; padding: 10px; margin-bottom: 8px; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>Video Pro Splitter</h2>
    <button class="menu-btn" onclick="document.getElementById('menu').style.display = document.getElementById('menu').style.display === 'block' ? 'none' : 'block'">⋮</button>
  </div>
  
  <div id="menu" class="dropdown">
    <button onclick="newProject()">➕ New Project</button>
    <button onclick="showHistory()">📜 History</button>
  </div>

  <input type="file" id="videoInput" accept="video/*">
  <select id="clipCount">
    <option value="2">2 Clips</option>
    <option value="4" selected>4 Clips</option>
    <option value="6">6 Clips</option>
    <option value="8">8 Clips</option>
  </select>

  <button class="btn-main" onclick="processVideo()">Split & Export</button>
  <div class="status" id="status">तैयार हूँ!</div>
</div>

<script>
let history = JSON.parse(localStorage.getItem('my_history') || '[]');

function newProject() {
  document.getElementById('videoInput').value = "";
  document.getElementById('status').innerText = "नया प्रोजेक्ट!";
  document.getElementById('menu').style.display = 'none';
}

async function processVideo() {
  const file = document.getElementById('videoInput').files[0];
  const count = parseInt(document.getElementById('clipCount').value);
  const status = document.getElementById('status');

  if (!file) return alert("वीडियो चुनें!");
  
  status.innerText = "प्रोसेसिंग...";
  const zip = new JSZip();
  const sliceSize = Math.floor(file.size / count);
  
  // क्लिप्स का एरे बनाना
  let clips = [];
  for (let i = 0; i < count; i++) {
    const start = i * sliceSize;
    const end = (i === count - 1) ? file.size : (i + 1) * sliceSize;
    clips.push(file.slice(start, end, file.type));
  }

  // शफल लॉजिक
  clips.sort(() => Math.random() - 0.5);

  // जिप में डालना
  for (let i = 0; i < clips.length; i++) {
    zip.file(`Clip_${i+1}.mp4`, clips[i]);
    status.innerText = `कटिंग: ${i+1}/${count}`;
  }

  const content = await zip.generateAsync({type: "blob"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = "Shuffled_VN_Clips.zip";
  a.click();
  
  saveHistory(file.name, count);
  status.innerText = "✅ डाउनलोड पूरा हुआ!";
}

function saveHistory(name, count) {
  history.unshift({name, count, date: new Date().toLocaleDateString()});
  if(history.length > 10) history.pop();
  localStorage.setItem('my_history', JSON.stringify(history));
}

function showHistory() {
  let html = "<h3>History</h3>";
  history.forEach(h => html += `<div class="history-card">${h.name} (${h.count} clips) - ${h.date}</div>`);
  document.getElementById('status').innerHTML = html || "कोई हिस्ट्री नहीं";
  document.getElementById('menu').style.display = 'none';
}
</script>
</body>
</html>
