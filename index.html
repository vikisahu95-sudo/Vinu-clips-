<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Pro Splitter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { background: #050505; color: #fff; font-family: sans-serif; padding: 20px; }
    .card { background: #1a1a1a; max-width: 500px; margin: auto; padding: 20px; border-radius: 15px; border: 1px solid #333; }
    input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #333; color: white; }
    .btn { background: #2563eb; font-weight: bold; cursor: pointer; }
    .status { color: #38bdf8; font-size: 14px; text-align: center; margin: 10px 0; }
  </style>
</head>
<body>

<div class="card">
  <h2>⚡ Video Pro Splitter</h2>
  <input type="file" id="videoInput" accept="video/*">
  <select id="clipCount">
    <option value="2">2 Clips</option>
    <option value="4" selected>4 Clips</option>
    <option value="6">6 Clips</option>
  </select>
  <button class="btn" onclick="startProcess()">Start Splitting & Export</button>
  <div class="status" id="status">तैयार हूँ!</div>
</div>

<script>
// यह कोड 'Blob Slicing' तकनीक का उपयोग करता है जो रेंडरिंग से कहीं ज्यादा तेज़ और स्टेबल है
async function startProcess() {
  const file = document.getElementById('videoInput').files[0];
  const count = document.getElementById('clipCount').value;
  const status = document.getElementById('status');

  if(!file) return alert("वीडियो चुनें!");
  
  status.innerText = "प्रोसेसिंग शुरू हो रही है...";
  const zip = new JSZip();
  
  // हम फाइल को सीधे बाइनरी तरीके से स्लाइस करेंगे (यह क्रैश नहीं होगा)
  const fileSize = file.size;
  const chunkSize = Math.floor(fileSize / count);

  for(let i = 0; i < count; i++) {
    status.innerText = `क्लिप ${i+1} तैयार की जा रही है...`;
    const start = i * chunkSize;
    const end = (i === count - 1) ? fileSize : (i + 1) * chunkSize;
    const blob = file.slice(start, end, file.type);
    
    // फाइल का नाम VN के लिए ताकि वो आर्डर में रहे
    zip.file(`Clip_${i+1}.mp4`, blob);
  }

  status.innerText = "ZIP कंप्रेस हो रही है...";
  const content = await zip.generateAsync({type:"blob"});
  
  const a = document.createElement('a');
  a.href = URL.createObjectURL(content);
  a.download = "My_VN_Clips.zip";
  a.click();
  
  status.innerText = "✅ डाउनलोड हो गया! अब ZIP को VN में खोलें।";
}
</script>
</body>
</html>
